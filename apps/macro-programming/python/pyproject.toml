[project]
name = "macro-programming"
version = "0.1.0"
description = "マクロ経済学のためのプログラミング（中級＋）（Python 版）"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "statsmodels>=0.14.5",
]

# 手元・CI のどこでも同じ Python（.python-version）を使うため、uv が管理する Python に限定する
[tool.uv]
python-preference = "only-managed"

# 記事の検査ツールは、3 シリーズ共通のパッケージ（apps/article-tools/）
[tool.uv.sources]
article-tools = { path = "../../article-tools", editable = true }

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# Windows で、Jupyter のカーネルを起動したときの、無害な警告
filterwarnings = ["ignore:Proactor event loop does not implement add_reader:RuntimeWarning"]

[tool.coverage.run]
source = ["lib"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# 型情報（スタブ）を持たないライブラリ
[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "article-tools",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "tox>=4.0",
    "pandas-stubs>=3.1.0.261029",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

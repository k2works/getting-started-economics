[tox]
envlist = test,lint,type,articles
skipsdist = true

# 依存関係は uv.lock で固定した uv の仮想環境を使い、tox はタスクランナーとして使う
[testenv]
skip_install = true
allowlist_externals = uv

# カバレッジは 100% を保つ（下回ると失敗する）
[testenv:test]
commands =
    uv run pytest --cov=lib --cov-fail-under=100 --cov-report=term-missing --verbose

[testenv:lint]
commands =
    uv run ruff check .
    uv run ruff format --check .

[testenv:format]
commands =
    uv run ruff format .

[testenv:type]
commands =
    uv run mypy lib test tools

# 記事とサンプル実装のずれを検出する（コード例の照合、実行結果の件数、解答のコードの実行）
[testenv:articles]
commands =
    uv run python -m tools.check_articles

[testenv:all]
commands =
    uv run pytest --cov=lib --cov-fail-under=100 --cov-report=term-missing
    uv run ruff check .
    uv run ruff format --check .
    uv run mypy lib test tools
    uv run python -m tools.check_articles

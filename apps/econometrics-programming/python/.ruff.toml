line-length = 88
# 読者が自分のコードを書く場所は、検査の対象にしない
extend-exclude = ["practice"]
target-version = "py312"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "C90",
]
ignore = []

[format]
quote-style = "double"
indent-style = "space"
# ノートブックは tools/build_notebooks.py から書き出す。Parameters のコメントの桁そろえを残すため、整形の対象にしない（lint は対象）
exclude = ["notebooks/*.ipynb"]

[lint.per-file-ignores]
"test/**/*.py" = ["E501"]

[lint.mccabe]
max-complexity = 7

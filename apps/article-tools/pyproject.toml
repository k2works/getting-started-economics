[project]
name = "article-tools"
version = "0.1.0"
description = "記事とサンプル実装のずれを検出する、全連載共通のツール"
requires-python = ">=3.12"
# 対象のシリーズ（apps/<シリーズ名>/python/）の環境で実行する。そのシリーズが、これらを入れている
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["article_tools"]

# 手元・CI のどこでも同じ Python（.python-version）を使うため、uv が管理する Python に限定する
[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

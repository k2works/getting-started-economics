[project]
name = "micro-basics-programming"
version = "0.1.0"
description = "ミクロ経済学のためのプログラミング（初級）（Python 版）"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
]

# 手元・CI のどこでも同じ Python（.python-version）を使うため、uv が管理する Python に限定する
[tool.uv]
python-preference = "only-managed"

# 記事の検査ツールは、シリーズ共通のパッケージ（apps/article-tools/）
[tool.uv.sources]
article-tools = { path = "../../article-tools", editable = true }

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# 同じ名前のテストファイル（test_plot.py など）が、章をまたいで並んでも、衝突しない
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["lib"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "article-tools",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "tox>=4.0",
]

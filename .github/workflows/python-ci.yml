name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/economics-programming/python/**"
      - "docs/article/economics-programming/**"
      - "apps/macro-programming/python/**"
      - "docs/article/macro-programming/**"
      - "apps/econometrics-programming/python/**"
      - "docs/article/econometrics-programming/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/economics-programming/python/**"
      - "docs/article/economics-programming/**"
      - "apps/macro-programming/python/**"
      - "docs/article/macro-programming/**"
      - "apps/econometrics-programming/python/**"
      - "docs/article/econometrics-programming/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    # シリーズごとに、同じ手順を実行する
    strategy:
      fail-fast: false
      matrix:
        series: [economics-programming, macro-programming, econometrics-programming]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.series }}/python

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.series }}/python/uv.lock

      # uv.lock と pyproject.toml がずれていたら、黙って再ロックせずに失敗させる
      - name: Install dependencies
        run: uv sync --locked

      # カバレッジが 100% を下回ると失敗する
      - name: Run tests
        run: uv run tox -e test

      - name: Run lint
        run: uv run tox -e lint

      - name: Run type check
        run: uv run tox -e type

      # 記事のコード例・実行結果の件数・解答のコード・図が、サンプル実装とずれていないかを確かめる
      - name: Check articles against the sample code
        run: uv run tox -e articles

      # 実データ（wooldridge）のスクリプトを実行し、出力が記事と一致するかを確かめる（第 3 シリーズのみ）。
      # practice/ は Git の管理外なので、lib の変更で記事のスクリプトが壊れても、ここまでは気づけない
      - name: Check the real-data scripts in the articles
        if: matrix.series == 'econometrics-programming'
        run: uv run tox -e realdata

  # 3 シリーズに複製した、記事の検査ツールとそのテストが、同一であることを確かめる。
  # 1 つだけ直して、ほかの複製が古いまま残る（実際に起きた）のを防ぐ。
  tools-sync:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Check the tools are identical in the three series
        run: |
          status=0
          for f in tools/check_articles.py tools/render_figures.py test/tools/test_check_articles.py test/tools/test_render_figures.py; do
            for s in macro-programming econometrics-programming; do
              diff -q --strip-trailing-cr "apps/economics-programming/python/$f" "apps/$s/python/$f" || status=1
            done
          done
          exit $status

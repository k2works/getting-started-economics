name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/economics-programming/python/**"
      - "docs/article/economics-programming/**"
      - "apps/macro-programming/python/**"
      - "docs/article/macro-programming/**"
      - "apps/econometrics-programming/python/**"
      - "docs/article/econometrics-programming/**"
      - "apps/macro-basics-programming/python/**"
      - "docs/article/macro-basics-programming/**"
      - "apps/micro-basics-programming/python/**"
      - "docs/article/micro-basics-programming/**"
      - "apps/article-tools/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/economics-programming/python/**"
      - "docs/article/economics-programming/**"
      - "apps/macro-programming/python/**"
      - "docs/article/macro-programming/**"
      - "apps/econometrics-programming/python/**"
      - "docs/article/econometrics-programming/**"
      - "apps/macro-basics-programming/python/**"
      - "docs/article/macro-basics-programming/**"
      - "apps/micro-basics-programming/python/**"
      - "docs/article/micro-basics-programming/**"
      - "apps/article-tools/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    # シリーズごとに、同じ手順を実行する
    strategy:
      fail-fast: false
      matrix:
        series:
          - economics-programming
          - macro-programming
          - econometrics-programming
          - macro-basics-programming
          - micro-basics-programming
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.series }}/python

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.series }}/python/uv.lock

      # uv.lock と pyproject.toml がずれていたら、黙って再ロックせずに失敗させる
      - name: Install dependencies
        run: uv sync --locked

      # カバレッジが 100% を下回ると失敗する
      - name: Run tests
        run: uv run tox -e test

      - name: Run lint
        run: uv run tox -e lint

      - name: Run type check
        run: uv run tox -e type

      # 記事のコード例・実行結果の件数・解答のコード・図が、サンプル実装とずれていないかを確かめる
      - name: Check articles against the sample code
        run: uv run tox -e articles

      # 実データ（wooldridge）のスクリプトを実行し、出力が記事と一致するかを確かめる（第 3 シリーズのみ）。
      # practice/ は Git の管理外なので、lib の変更で記事のスクリプトが壊れても、ここまでは気づけない
      - name: Check the real-data scripts in the articles
        if: matrix.series == 'econometrics-programming'
        run: uv run tox -e realdata

  # 全連載共通の、記事の検査ツール（apps/article-tools/）のテスト・lint・型検査
  article-tools:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/article-tools

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/article-tools/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Run lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type check
        run: uv run mypy article_tools tests

site_name: 経済学入門
site_description: Site Description
site_author: Project Team
repo_url: https://github.com/k2works/claude-code-booster
repo_name: claude-code-booster

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - assets/js/extra.js
  # 数式（MathJax 3）。設定を先に読み込んでから MathJax 本体を読み込む
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works
      name: GitHub Repository/claude-code-booster

plugins:
  - search

exclude_docs: |
  wiki
  # 執筆者向けの内部文書（読者向けのサイトには含めない）
  article/economics-programming/outline.md
  article/macro-programming/outline.md
  article/econometrics-programming/outline.md
  article/macro-basics-programming/outline.md
  article/micro-basics-programming/outline.md
  # 参照用に取得した外部資料（.gitignore の対象。サイトには含めない）
  article/py4basics.github.io/
  article/py4etrics.github.io/
  article/py4macro.github.io/

nav:
  - Home: index.md
  - 戦略:
      - 概要: strategy/index.md
  - 要件:
      - 概要: requirements/index.md
  - 設計:
      - 概要: design/index.md
  - 開発:
      - 概要: development/index.md
  - 運用:
      - 概要: operation/index.md
  - レビュー:
      - 概要: review/index.md
  - ADR:
      - 概要: adr/index.md
      - ミクロ経済学のためのプログラミング（初級）:
          - 一覧: adr/micro-basics-programming/index.md
          - ADR-001 第 12・13 章の分割: adr/micro-basics-programming/001-split-chapters-12-and-13.md
          - ADR-002 共通ツールの改善: adr/micro-basics-programming/002-shared-tooling-improvements.md
          - ADR-003 pytest-timeout: adr/micro-basics-programming/003-pytest-timeout.md
